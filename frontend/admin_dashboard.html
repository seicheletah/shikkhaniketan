<!-- ==========================================================
     ADMIN DASHBOARD PAGE (loaded inside admin.html with fetch)

     The three cards show:
       Total Students  -> counted from GET /admin/users (users whose role is "student")
       Total Teachers  -> counted from GET /admin/users (users whose role is "teacher")
       Total Courses   -> counted from GET /admin/courses (every course)

     The APIs return the data in pages (50 at a time), so the script reads
     page after page until the last one, and counts everything.
     ========================================================== -->
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<h1 class="page-title">Dashboard</h1>

<div class="stats-grid">

    <!-- CARD 1: students -->
    <div class="stat-card">
        <div class="stat-top">
            <span class="stat-label">Total Students</span>
            <!-- Icon: graduation cap (inline SVG, so it always shows) -->
            <span class="stat-icon mint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 10 12 5 2 10l10 5 10-5z" />
                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                </svg>
            </span>
        </div>
        <div class="stat-value" id="dbStudents">...</div>
        <div class="stat-note">Registered students</div>
    </div>

    <!-- CARD 2: teachers -->
    <div class="stat-card">
        <div class="stat-top">
            <span class="stat-label">Total Teachers</span>
            <!-- Icon: person -->
            <span class="stat-icon blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                </svg>
            </span>
        </div>
        <div class="stat-value" id="dbTeachers">...</div>
        <div class="stat-note">Registered teachers</div>
    </div>

    <!-- CARD 3: courses (this card used to be "Total Admins") -->
    <div class="stat-card">
        <div class="stat-top">
            <span class="stat-label">Total Courses</span>
            <!-- Icon: open book -->
            <span class="stat-icon yellow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z" />
                    <path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z" />
                </svg>
            </span>
        </div>
        <div class="stat-value" id="dbCourses">...</div>
        <div class="stat-note">Published courses</div>
    </div>

</div>

<!-- Error text (stays empty when everything works) -->
<p id="dbError" class="empty-text" style="color:#d9534f; margin-top:16px;"></p>

<script>
    /* The whole script is wrapped in a function so its variable names never clash
       when admin.js loads this page again (it re-runs the script every time). */
    (function () {

        // ---------- Settings ----------
        const API = 'api/v1';
        const LIMIT = 50;           // items per page asked from the API

        // Calls the backend with the admin's saved login token
        async function api(path) {
            const res = await fetch(API + path, {
                headers: {
                    'Accept': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                }
            });

            // 401 = token expired or invalid -> log the admin out (function comes from admin.js)
            if (res.status === 401 && typeof logoutUser === 'function') { logoutUser(); return null; }

            const data = await res.json().catch(() => []);
            if (!res.ok) {
                throw new Error(typeof data.detail === 'string' ? data.detail : 'Request failed (' + res.status + ')');
            }
            return data;
        }

        // ---------- Count students and teachers ----------
        // GET /admin/users uses "last_id" paging: each page starts after the last user of the page before.
        async function countUsers() {
            const counts = { student: 0, teacher: 0 };
            let lastId = null;

            for (let page = 0; page < 200; page++) {      // 200 pages x 50 = 10,000 users maximum
                const list = await api(`/admin/users?limit=${LIMIT}` + (lastId ? `&last_id=${lastId}` : ''));
                if (!list) return null;

                // Count each user by role
                list.forEach(u => {
                    const role = String(u.role || '').toLowerCase();
                    if (role in counts) counts[role]++;
                });

                if (list.length < LIMIT) break;            // a short page = the last page
                lastId = list[list.length - 1].id;
            }
            return counts;
        }

        // ---------- Count courses ----------
        // GET /admin/courses uses "offset" paging: each page skips the courses already counted.
        async function countCourses() {
            let total = 0;

            for (let page = 0; page < 200; page++) {
                const list = await api(`/admin/courses?offset=${page * LIMIT}&limit=${LIMIT}`);
                if (!list) return null;

                total += list.length;
                if (list.length < LIMIT) break;            // a short page = the last page
            }
            return total;
        }

        // ---------- Run both counts and show the numbers ----------
        async function loadCounts() {
            const errors = [];

            // The two counts run at the same time; one failing does not stop the other
            const [users, courses] = await Promise.all([
                countUsers().catch(e => { errors.push('Users: ' + e.message); return undefined; }),
                countCourses().catch(e => { errors.push('Courses: ' + e.message); return undefined; })
            ]);

            // A card shows "-" when its count could not be loaded
            document.getElementById('dbStudents').textContent = users ? users.student : '-';
            document.getElementById('dbTeachers').textContent = users ? users.teacher : '-';
            document.getElementById('dbCourses').textContent = (courses === undefined || courses === null) ? '-' : courses;

            document.getElementById('dbError').textContent = errors.join('  |  ');
        }

        loadCounts();
    })();
</script>
