<link rel="stylesheet" href="course_view.css">

<div class="course-view-page">

    <button class="cv-back-btn" id="cvBackBtn">
        <i class="fa-solid fa-arrow-left"></i> Back to Course
    </button>

    <div class="course-player-container">

        <!-- MEDIA VIEWER (VIDEO & PDF) -->
        <div class="media-viewer-card">

            <div class="media-toggle-bar">
                <button class="toggle-btn active" data-media="video">
                    <i class="fa-solid fa-circle-play"></i> Video Player
                </button>
                <button class="toggle-btn" data-media="pdf">
                    <i class="fa-solid fa-file-pdf"></i> PDF Reader
                </button>
            </div>

            <!-- VIDEO -->
            <div class="media-box" id="videoPlayerBox">
                <video controls>
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- PDF -->
            <div class="media-box hidden" id="pdfReaderBox">
                <iframe width="100%" height="500px"></iframe>
            </div>

        </div>

        <!-- OVERVIEW & REVIEWS -->
        <div class="overview-review-card">

            <div class="tabs-header">
                <button class="cv-tab-btn active" data-tab="overview">Overview</button>
                <button class="cv-tab-btn" data-tab="reviews">Reviews</button>
            </div>

            <!-- OVERVIEW -->
            <div class="cv-tab-content" id="overviewTab">
                <h3 id="cvTitle">Course</h3>
                <p id="cvOverview">Welcome to the premium course module. Access all video lectures, course slides, and downloadable resource materials directly from this viewer.</p>

                <div class="resource-list">
                    <h4>Course Resources</h4>
                    <ul id="cvResourceList">
                        <li>Loading resources...</li>
                    </ul>
                </div>
            </div>

            <!-- REVIEWS -->
            <div class="cv-tab-content hidden" id="reviewsTab">
                <h3>Student Feedback</h3>
            </div>

        </div>

    </div>

</div>

<script src="course_view.js"></script>
