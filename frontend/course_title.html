<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <link rel="stylesheet" href="course_title.css">
</head>

<body>

    <div class="course-container">

        <!-- Course Title -->
        <h1>View jCourse</h1>

        <p class="subtitle">
            comment and review on this page .
        </p>

        <!-- Three Boxes -->
        <div class="course-boxes">

            <!-- Description -->
            <div class="course-box">
                <h2>📖 Description</h2>
                <p>
                    This course teaches you the basics of web development.
                </p>
            </div>

            <!-- Review -->
            <div class="course-box">
                <h2>💬 Review</h2>
                <p>
                    "This course is very easy to understand and helpful
                    for beginners.
                </p>

                <h4>- Student Review</h4>
            </div>

            <!-- Rating -->
            <div class="course-box rating-box">
                <h2>⭐ Rating</h2>

                <div class="stars">
                    ★ ★ ★ ★ ★
                </div>

                <p>4.8 out of 5</p>
                <small>Based on 250 reviews</small>
            </div>

        </div>

    </div>

</body>
</html>
