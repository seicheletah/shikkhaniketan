<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Course Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #eaf6f6;
    }

    /* Main Page Container */
    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Form Title */
    .page-title {
      color: #0f4c5c;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    /* Main White Outer Card */
    .main-card {
      background-color: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 10px 30px -5px rgba(15, 76, 92, 0.08);
    }

    /* Form Grid Layout */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Inner Rounded Field Boxes */
    .field-box {
      background-color: #ffffff;
      border: 1.5px solid #d8ecf3;
      border-radius: 18px;
      padding: 16px 20px;
      position: relative;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-box:focus-within {
      border-color: #88c5db;
      box-shadow: 0 0 0 3px rgba(136, 197, 219, 0.15);
    }

    .full-width {
      grid-column: span 1;
    }

    /* Field Labels */
    .field-label {
      display: block;
      color: #3b628c;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    /* Input & Textarea elements */
    .field-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 18px;
      color: #2c4a6f;
      background: transparent;
      padding: 0;
    }

    .field-input::placeholder {
      color: #7b9ebc;
      opacity: 0.8;
    }

    /* Custom Dropdown Trigger Button */
    .select-btn {
      width: 100%;
      max-width: 220px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background-color: #ffffff;
      border: 1px solid #d0e7f0;
      border-radius: 12px;
      color: #3b628c;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .select-btn:hover {
      border-color: #a0cce0;
    }

    .arrow-icon {
      width: 12px;
      height: 12px;
      fill: #3b628c;
      transition: transform 0.2s ease;
    }

    .custom-dropdown-container.is-open .arrow-icon {
      transform: rotate(180deg);
    }

    /* Custom Dropdown Menu Popup */
    .dropdown-menu {
      position: absolute;
      top: calc(100% - 10px);
      left: 16px;
      width: 240px;
      background-color: #ffffff;
      border: 1px solid #d0e7f0;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(59, 98, 140, 0.15);
      padding: 6px;
      z-index: 100;
      list-style: none;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s ease;
    }

    .custom-dropdown-container.is-open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-option {
      padding: 10px 14px;
      color: #3b628c;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .dropdown-option:hover {
      background-color: #f0f7fa;
    }

    .dropdown-option.selected {
      background-color: #e4f2f8;
      font-weight: 600;
    }

    /* Action Buttons Container (Bottom Right Corner) */
    .action-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      margin-top: 28px;
      padding-top: 10px;
    }

    /* Action Buttons */
    .btn {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Delete Button (Soft Pink/Red Style) */
    .btn-delete {
      background-color: #fce8e8;
      color: #d93838;
      border: 1.5px solid #f8c4c4;
    }

    .btn-delete:hover {
      background-color: #f8d7d7;
      color: #b91c1c;
      border-color: #f0a3a3;
    }

    /* Submit Button (Dark Teal Theme Matching Title) */
    .btn-submit {
      background-color: #0f4c5c;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 76, 92, 0.25);
    }

    .btn-submit:hover {
      background-color: #0b3a46;
      box-shadow: 0 6px 16px rgba(15, 76, 92, 0.35);
    }

    /* Toast Notification Box */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f4c5c;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      font-size: 15px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <h1 class="page-title">Edit Course</h1>

    <div class="main-card">
      <form id="courseForm" onsubmit="handleSubmit(event)">
        
        <div class="form-grid">
          
          <!-- Field 1: Course Name -->
          <div class="field-box">
            <label class="field-label" for="courseName">Course Name</label>
            <input type="text" id="courseName" class="field-input" placeholder="Enter Course Name" required>
          </div>

          <!-- Field 2: Course Details -->
          <div class="field-box">
            <label class="field-label" for="courseDetails">Course detailsa</label>
            <input type="text" id="courseDetails" class="field-input" placeholder="Enter Course details">
          </div>

          <!-- Field 3: Course Language Custom Dropdown -->
          <div class="field-box custom-dropdown-container" id="langDropdownContainer">
            <label class="field-label">Course Language</label>
            <button type="button" class="select-btn" id="langBtn" onclick="toggleDropdown('langDropdownContainer')">
              <span id="langText">Course Language</span>
              <svg class="arrow-icon" viewBox="0 0 20 20">
                <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
              </svg>
            </button>
            <ul class="dropdown-menu">
              <li class="dropdown-option" onclick="selectOption('langDropdownContainer', 'langText', 'English')">English</li>
              <li class="dropdown-option" onclick="selectOption('langDropdownContainer', 'langText', 'Hindi (हिंदी)')">Hindi (हिंदी)</li>
              <li class="dropdown-option" onclick="selectOption('langDropdownContainer', 'langText', 'Bengali (বাংলা)')">Bengali (বাংলা)</li>
            </ul>
          </div>

          <!-- Field 4: Course Type Custom Dropdown -->
          <div class="field-box custom-dropdown-container" id="typeDropdownContainer">
            <label class="field-label">Course paid</label>
            <button type="button" class="select-btn" id="typeBtn" onclick="toggleDropdown('typeDropdownContainer')">
              <span id="typeText">Course Type</span>
              <svg class="arrow-icon" viewBox="0 0 20 20">
                <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
              </svg>
            </button>
            <ul class="dropdown-menu">
              <li class="dropdown-option" onclick="selectOption('typeDropdownContainer', 'typeText', 'Yes')">Yes</li>
              <li class="dropdown-option" onclick="selectOption('typeDropdownContainer', 'typeText', 'No')">No</li>
            </ul>
          </div>

          <!-- Field 5: Course Price -->
          <div class="field-box full-width">
            <label class="field-label" for="coursePrice">Course price</label>
            <input type="text" id="coursePrice" class="field-input" placeholder="Enter Course Price">
          </div>

        </div>

        <div class="action-bar">
          <button type="button" class="btn btn-delete" onclick="handleCancel()">Cancel</button>
          <button type="submit" class="btn btn-submit">Submit</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast">Action performed successfully!</div>

  <script>
    // Dropdown Toggle Logic
    function toggleDropdown(containerId) {
      const container = document.getElementById(containerId);
      const isAlreadyOpen = container.classList.contains('is-open');
      
      // Close all dropdowns first
      document.querySelectorAll('.custom-dropdown-container').forEach(el => {
        el.classList.remove('is-open');
      });

      // Toggle current if it wasn't open
      if (!isAlreadyOpen) {
        container.classList.add('is-open');
      }
    }

    // Option Select Logic
    function selectOption(containerId, textElementId, value) {
      document.getElementById(textElementId).textContent = value;
      const container = document.getElementById(containerId);
      
      // Update selected class style
      container.querySelectorAll('.dropdown-option').forEach(opt => {
        if(opt.textContent === value) {
          opt.classList.add('selected');
        } else {
          opt.classList.remove('selected');
        }
      });

      container.classList.remove('is-open');
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.custom-dropdown-container')) {
        document.querySelectorAll('.custom-dropdown-container').forEach(el => {
          el.classList.remove('is-open');
        });
      }
    });

    // Show Notification Message
    function showToast(message, bgColor) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.backgroundColor = bgColor || '#0f4c5c';
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Form Submit Handler
    function handleSubmit(event) {
      event.preventDefault();
      const courseName = document.getElementById('courseName').value || 'Course';
      showToast(`'${courseName}' submitted successfully!`, '#0f4c5c');
    }

    // Delete Button Handler
    function handleDelete() {
      if (confirm('Are you sure you want to delete this course?')) {
        document.getElementById('courseForm').reset();
        document.getElementById('langText').textContent = 'Course Language';
        document.getElementById('typeText').textContent = 'Course Type';
        showToast('Course deleted successfully!', '#b91c1c');
      }
    }
  </script>
</body>
</html>
