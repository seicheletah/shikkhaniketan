<!-- ==========================================================
     COURSE MANAGEMENT PAGE (loaded inside admin.html with fetch)
     APIs: GET    /admin/courses?offset=&limit=   (list - see note in the reply)
           GET    /admin/courses/{id}
           PATCH  /admin/courses/{id}  { course_name, course_details, course_language,
                                         course_paid, course_price,
                                         course_price_currency, course_tags }
           DELETE /admin/courses/{id}
     ========================================================== -->
<style>
    .cr-box { background:#fff; border:1px solid #e5e9f0; border-radius:12px; padding:20px; }
    .cr-bar { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .cr-search { flex:1; min-width:200px; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; outline:none; }
    .cr-search:focus { border-color:#0f766e; }
    .cr-wrap { overflow-x:auto; }
    table.cr-table { width:100%; border-collapse:collapse; font-size:14px; }
    table.cr-table th { text-align:left; padding:10px 12px; font-size:12px; text-transform:uppercase; color:#475f7b; border-bottom:1px solid #e5e9f0; white-space:nowrap; }
    table.cr-table td { padding:10px 12px; border-bottom:1px solid #eef1f6; vertical-align:middle; }
    .cr-mono { font-family:Consolas,'Courier New',monospace; font-size:12px; word-break:break-all; min-width:150px; }
    .cr-long { min-width:180px; max-width:280px; word-break:break-word; }
    .cr-btn { border:0; border-radius:8px; padding:8px 14px; font-weight:600; font-size:13px; cursor:pointer; background:#0f766e; color:#fff; }
    .cr-btn.edit { background:#e0f2fe; color:#075985; }
    .cr-btn.del { background:#fee2e2; color:#991b1b; }
    .cr-btn.light { background:#e2e8f0; color:#0f172a; }
    .cr-btn:disabled { opacity:.55; cursor:not-allowed; }
    .cr-pill { background:#ccfbf1; color:#0f766e; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:700; margin:0 4px 4px 0; display:inline-block; }
    .cr-badge { padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; }
    .cr-badge.paid { background:#fef3c7; color:#92400e; }
    .cr-badge.free { background:#dcfce7; color:#166534; }
    .cr-pager { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:16px; }
    .cr-msg { margin-bottom:14px; font-size:14px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:10px 14px; display:none; }

    /* Details / edit popup */
    .cr-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
    .cr-modal.open { display:flex; }
    .cr-card { background:#fff; border-radius:14px; padding:24px; width:100%; max-width:560px; margin:auto; }
    .cr-card h3 { margin-bottom:6px; }
    .cr-card label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; }
    .cr-card input, .cr-card select, .cr-card textarea { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; font-family:inherit; }
    .cr-card input[readonly] { background:#f1f5f9; color:#475569; }
    .cr-card textarea { min-height:100px; resize:vertical; }
    .cr-two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .cr-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .cr-note { font-size:12px; color:#64748b; margin-top:6px; }
    .cr-warn { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:8px; padding:10px 12px; font-size:13px; margin-top:8px; }
</style>

<h1 class="page-title">Course Management</h1>

<div class="cr-box">
    <div class="cr-msg" id="crMsg"></div>

    <div class="cr-bar">
        <input class="cr-search" id="crSearch" type="text" placeholder="Search this page by course name, tag, language or ID...">
        <input class="cr-search" id="crFindId" type="text" placeholder="Find one course by its full ID" style="max-width:340px;">
        <button class="cr-btn" id="crFindBtn">Find by ID</button>
        <button class="cr-btn light" id="crResetBtn">Show all</button>
    </div>

    <div class="cr-wrap">
        <table class="cr-table">
            <thead>
                <tr>
                    <th>Course</th><th>Details</th><th>Language</th><th>Type</th><th>Price</th><th>Tags</th>
                    <th>Enrolled</th><th>Comments</th><th>Total rating</th><th>Avg rating</th><th>Created</th><th>Course ID</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="crBody"><tr><td colspan="13">Loading...</td></tr></tbody>
        </table>
    </div>

    <div class="cr-pager" id="crPager">
        <button class="cr-btn light" id="crPrev">Previous</button>
        <span id="crPageText" class="empty-text"></span>
        <button class="cr-btn light" id="crNext">Next</button>
    </div>
</div>

<!-- Details + edit popup -->
<div class="cr-modal" id="crModal">
    <div class="cr-card">
        <h3>Course Details</h3>

        <label for="crName">Course name</label>
        <input type="text" id="crName">

        <label for="crDetails">Course details</label>
        <textarea id="crDetails"></textarea>

        <div class="cr-two">
            <div>
                <label for="crLang">Language</label>
                <select id="crLang">
                    <option value="english">English</option>
                    <option value="bengali">Bengali</option>
                    <option value="hindi">Hindi</option>
                </select>
            </div>
            <div>
                <label for="crPaid">Price type</label>
                <select id="crPaid">
                    <option value="true">Paid</option>
                    <option value="false">Free</option>
                </select>
            </div>
        </div>

        <div class="cr-two">
            <div><label for="crPrice">Price</label><input type="number" id="crPrice" min="0" step="1"></div>
            <div><label for="crCurrency">Currency</label><input type="text" id="crCurrency" placeholder="INR"></div>
        </div>

        <label for="crTags">Tags (separate with commas)</label>
        <input type="text" id="crTags" placeholder="diploma, mba, b.tech">

        <div class="cr-two">
            <div><label for="crType">Resource type</label><input type="text" id="crType" readonly></div>
            <div><label for="crEnroll">Total enrollment</label><input type="text" id="crEnroll" readonly></div>
        </div>
        <div class="cr-two">
            <div><label for="crComments">Total comments</label><input type="text" id="crComments" readonly></div>
            <div><label for="crRating">Total rating / Avg rating</label><input type="text" id="crRating" readonly></div>
        </div>

        <label for="crId">Course ID</label>
        <input type="text" id="crId" readonly>

        <label for="crCreated">Created at</label>
        <input type="text" id="crCreated" readonly>

        <div class="cr-actions">
            <button class="cr-btn light" id="crCancel">Close</button>
            <button class="cr-btn" id="crSave">Save changes</button>
        </div>
    </div>
</div>

<!-- Delete confirmation popup -->
<div class="cr-modal" id="crDelModal">
    <div class="cr-card" style="max-width:440px;">
        <h3>Delete this course?</h3>
        <p class="cr-note" id="crDelName" style="font-size:14px; color:#0f172a; margin-top:8px;"></p>
        <div class="cr-warn">This deletes the course completely. It cannot be undone.</div>
        <div class="cr-actions">
            <button class="cr-btn light" id="crDelCancel">Cancel</button>
            <button class="cr-btn del" id="crDelConfirm">Yes, delete</button>
        </div>
    </div>
</div>

<script>
(function () {
    const API = 'http://127.0.0.1:8000/api/v1';
    const LIMIT = 50;
    let offset = 0;
    let items = [];             // courses shown in the table
    let editingId = null;       // id of the course inside the edit popup
    let deletingId = null;      // id of the course inside the delete popup
    let singleMode = false;     // true while one course found by ID is shown

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = (d) => d ? new Date(d).toLocaleString() : '-';
    const COLS = 13;

    async function api(path, options = {}) {
        const res = await fetch(API + path, {
            ...options,
            headers: {
                'Accept': 'application/json',
                ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                'Authorization': 'Bearer ' + localStorage.getItem('access_token')
            }
        });
        if (res.status === 401 && typeof logoutUser === 'function') { logoutUser(); return null; }
        const data = await res.json().catch(() => ({}));   // DELETE answers 204 (no body)
        if (!res.ok) {
            const err = new Error(typeof data.detail === 'string' ? data.detail : (data.detail && data.detail[0] ? data.detail[0].msg : 'Request failed (' + res.status + ')'));
            err.status = res.status;
            throw err;
        }
        return data;
    }

    function showMsg(text) {
        const m = $('crMsg');
        m.textContent = text || '';
        m.style.display = text ? 'block' : 'none';
    }

    // ---------- Table ----------
    function render() {
        const q = $('crSearch').value.trim().toLowerCase();
        const rows = items.filter(c => !q || [c.course_name, c.course_language, c.id, (c.course_tags || []).join(' ')]
            .some(v => String(v || '').toLowerCase().includes(q)));

        $('crBody').innerHTML = rows.length ? rows.map(c => `
            <tr>
                <td class="cr-long"><strong>${esc(c.course_name)}</strong></td>
                <td class="cr-long">${esc(c.course_details)}</td>
                <td style="text-transform:capitalize;">${esc(c.course_language)}</td>
                <td style="text-transform:capitalize;">${esc(c.course_resource_type)}</td>
                <td>${c.course_paid
                    ? '<span class="cr-badge paid">Paid</span> ' + esc(c.course_price) + ' ' + esc(c.course_price_currency)
                    : '<span class="cr-badge free">Free</span>'}</td>
                <td>${(c.course_tags || []).map(t => '<span class="cr-pill">' + esc(t) + '</span>').join('') || '-'}</td>
                <td>${esc(c.total_enrollment)}</td>
                <td>${esc(c.total_comment)}</td>
                <td>${esc(c.total_rating)}</td>
                <td>${esc(c.avg_rating)}</td>
                <td>${esc(fmt(c.created_at))}</td>
                <td class="cr-mono">${esc(c.id)}</td>
                <td style="white-space:nowrap;">
                    <button class="cr-btn edit" data-act="edit" data-id="${esc(c.id)}">View / Edit</button>
                    <button class="cr-btn del" data-act="delete" data-id="${esc(c.id)}">Delete</button>
                </td>
            </tr>`).join('') : `<tr><td colspan="${COLS}">No courses found.</td></tr>`;
    }

    async function load() {
        singleMode = false;
        $('crPager').style.display = 'flex';
        $('crBody').innerHTML = `<tr><td colspan="${COLS}">Loading...</td></tr>`;
        try {
            const list = await api(`/admin/courses?offset=${offset}&limit=${LIMIT}`);
            if (!list) return;
            showMsg('');
            items = Array.isArray(list) ? list : [];
            render();
            $('crPageText').textContent = 'Page ' + (offset / LIMIT + 1);
            $('crPrev').disabled = offset === 0;
            $('crNext').disabled = items.length < LIMIT;
        } catch (e) {
            items = [];
            render();
            // The list API was not in the screenshots: if it does not exist, "Find by ID" still works.
            showMsg(e.status === 404 || e.status === 405
                ? 'The course list API (GET /admin/courses) was not found on the backend. Use "Find by ID" to open a course.'
                : e.message);
            $('crBody').innerHTML = `<tr><td colspan="${COLS}">No courses to show.</td></tr>`;
        }
    }

    // ---------- Find one course by ID ----------
    $('crFindBtn').addEventListener('click', async () => {
        const id = $('crFindId').value.trim();
        if (!id) { alert('Paste the full course ID first.'); return; }
        try {
            const c = await api('/admin/courses/' + id);
            if (!c) return;
            singleMode = true;
            items = [c];
            showMsg('');
            $('crPager').style.display = 'none';
            $('crSearch').value = '';
            render();
        } catch (e) { alert(e.message); }
    });

    $('crResetBtn').addEventListener('click', () => { $('crFindId').value = ''; offset = 0; load(); });

    // ---------- Edit popup ----------
    function fillModal(c) {
        editingId = c.id;
        $('crName').value = c.course_name || '';
        $('crDetails').value = c.course_details || '';

        // Keep an unknown language as an extra option so it is not lost
        const lang = $('crLang');
        [...lang.querySelectorAll('option[data-extra]')].forEach(o => o.remove());
        if (c.course_language && ![...lang.options].some(o => o.value === c.course_language)) {
            const o = document.createElement('option');
            o.value = c.course_language; o.textContent = c.course_language; o.dataset.extra = '1';
            lang.appendChild(o);
        }
        lang.value = c.course_language || 'english';

        $('crPaid').value = c.course_paid ? 'true' : 'false';
        $('crPrice').value = c.course_price ?? 0;
        $('crCurrency').value = c.course_price_currency || 'INR';
        $('crTags').value = (c.course_tags || []).join(', ');
        $('crType').value = c.course_resource_type || '';
        $('crEnroll').value = c.total_enrollment ?? 0;
        $('crComments').value = c.total_comment ?? 0;
        $('crRating').value = (c.total_rating ?? 0) + ' / ' + (c.avg_rating ?? 0);
        $('crId').value = c.id || '';
        $('crCreated').value = fmt(c.created_at);
        $('crModal').classList.add('open');
    }

    $('crBody').addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const id = btn.dataset.id;

        if (btn.dataset.act === 'edit') {
            btn.disabled = true;
            try {
                const fresh = await api('/admin/courses/' + id);   // latest data of this one course
                if (fresh) fillModal(fresh);
            } catch (err) { alert(err.message); }
            btn.disabled = false;
        }

        if (btn.dataset.act === 'delete') {
            const c = items.find(x => String(x.id) === id);
            deletingId = id;
            $('crDelName').textContent = (c ? c.course_name : '') + '  (' + id + ')';
            $('crDelModal').classList.add('open');
        }
    });

    $('crCancel').addEventListener('click', () => $('crModal').classList.remove('open'));

    $('crSave').addEventListener('click', async () => {
        const body = {
            course_name: $('crName').value.trim(),
            course_details: $('crDetails').value.trim(),
            course_language: $('crLang').value,
            course_paid: $('crPaid').value === 'true',
            course_price: Number($('crPrice').value || 0),
            course_price_currency: $('crCurrency').value.trim() || 'INR',
            course_tags: $('crTags').value.split(',').map(t => t.trim()).filter(Boolean)
        };
        if (!body.course_name) { alert('Course name cannot be empty.'); return; }

        const btn = $('crSave');
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
            const updated = await api('/admin/courses/' + editingId, { method: 'PATCH', body: JSON.stringify(body) });
            if (updated) items = items.map(c => c.id === editingId ? { ...c, ...updated } : c);
            $('crModal').classList.remove('open');
            render();
        } catch (err) { alert(err.message); }
        btn.disabled = false; btn.textContent = 'Save changes';
    });

    // ---------- Delete ----------
    $('crDelCancel').addEventListener('click', () => $('crDelModal').classList.remove('open'));

    $('crDelConfirm').addEventListener('click', async () => {
        const btn = $('crDelConfirm');
        btn.disabled = true; btn.textContent = 'Deleting...';
        try {
            await api('/admin/courses/' + deletingId, { method: 'DELETE' });
            items = items.filter(c => String(c.id) !== deletingId);
            $('crDelModal').classList.remove('open');
            render();
        } catch (err) { alert(err.message); }
        btn.disabled = false; btn.textContent = 'Yes, delete';
    });

    $('crSearch').addEventListener('input', render);
    $('crPrev').addEventListener('click', () => { offset = Math.max(0, offset - LIMIT); load(); });
    $('crNext').addEventListener('click', () => { offset += LIMIT; load(); });

    load();
})();
</script>
