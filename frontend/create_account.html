<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shakkhaniketan - Create Account</title>

    <link rel="stylesheet" href="create_account.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Header Section -->
    <header>

        <div class="logo">
            Skillhub
        </div>

        <nav>
            <a href="index.html">
                Home
            </a>
        </nav>

    </header>


    <!-- Main Content Container -->
    <main class="container">

        <!-- Left Section -->
        <section class="left-section">

            <h1>
                Learn. Grow. Succeed.
            </h1>

            <div class="illustration-container">

                <img
                    src="picture.jpeg"
                    alt="Student studying with interactive elements">

            </div>

        </section>


        <!-- Right Section -->
        <section class="right-section">

            <div class="form-card">

                <h2>
                    CREATE ACCOUNT
                </h2>


                <form id="profileForm">

                    <!-- First Name -->
                    <div class="form-group">

                        <label for="first-name">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="first-name"
                            name="first_name"
                            placeholder="First Name"
                            required>

                    </div>


                    <!-- Last Name -->
                    <div class="form-group">

                        <label for="last-name">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="last-name"
                            name="last_name"
                            placeholder="Last Name"
                            required>

                    </div>


                    <!-- Phone Number -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Phone Number"
                            required>

                    </div>


                    <!-- Gender -->
                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender"
                            name="gender"
                            required>

                            <option
                                value=""
                                disabled
                                selected
                                hidden>
                                Gender
                            </option>

                            <option value="m">
                                Male
                            </option>

                            <option value="f">
                                Female
                            </option>

                            <option value="o">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Date of Birth -->
                    <div class="form-group">

                        <label for="dob">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            required>

                    </div>


                    <!-- Address -->
                    <div class="form-group">

                        <label for="address">
                            Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            name="address"
                            placeholder="Enter your address">

                    </div>


                    <!-- About -->
                    <div class="form-group">

                        <label for="about">
                            About
                        </label>

                        <input
                            type="text"
                            id="about"
                            name="about"
                            placeholder="Tell something about yourself...">

                    </div>


                    <!-- Submit Button -->
                    <button type="submit">
                        Done
                    </button>

                </form>

            </div>

        </section>

    </main>


    <script src="create_account.js"></script>

</body>

</html>
