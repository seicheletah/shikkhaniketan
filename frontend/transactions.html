<!-- ==========================================================
     transactions.html
     This is NOT a full HTML document. It is only a "fragment"
     that student.js downloads with fetch() and puts inside
     <main id="main-content"> of student.html.
     (Same idea as courses.html and settings.html.)
     ========================================================== -->

<!-- Styles for this page only (every rule is scoped to .transactions-page) -->
<link rel="stylesheet" href="transactions.css">

<div class="transactions-page">

    <!-- ================= HERO HEADER =================
         Big green banner with the title "My Transactions".
         The two summary chips (courses purchased / total spent)
         are inside it and are filled by transactions.js. -->
    <header class="tx-hero">

        <div class="tx-hero-top">
            <div class="tx-hero-icon">
                <!-- Receipt icon (inline SVG, so it never depends on FontAwesome) -->
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7-3-2-3 2-3-2-3 2z"></path>
                    <line x1="8" y1="9" x2="16" y2="9"></line>
                    <line x1="8" y1="13" x2="14" y2="13"></line>
                </svg>
            </div>

            <div>
                <h1 class="tx-title">My Transactions</h1>
                <p class="tx-subtitle">All the courses you have purchased, with downloadable invoices.</p>
            </div>
        </div>

        <!-- Summary chips: hidden until the data has loaded -->
        <div class="tx-summary hidden" id="txSummary">
            <div class="tx-stat">
                <span class="tx-stat-label">Courses purchased</span>
                <strong class="tx-stat-value" id="txCount">0</strong>
            </div>

            <div class="tx-stat">
                <span class="tx-stat-label">Total spent</span>
                <strong class="tx-stat-value" id="txTotal">0</strong>
            </div>
        </div>

    </header>

    <!-- ================= PURCHASE LIST =================
         transactions.js puts the spinner, an error / empty message,
         or the numbered rows (1, 2, 3 ...) in here. -->
    <section class="tx-list" id="txGrid"></section>

    <!-- Small pop-up message at the bottom (e.g. "Invoice downloaded") -->
    <div class="tx-toast hidden" id="txToast"></div>

</div>

<!-- The page logic. student.js re-creates this <script> tag so it really runs. -->
<script src="transactions.js"></script>
