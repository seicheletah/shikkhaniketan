<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillHub - Explore Courses</title>
  <link rel="stylesheet" href="explore.css">
</head>
<body>

  <!-- ================= TOP SEARCH (searches COURSES by name) ================= -->
  <section class="search-section">
    <div class="search-box">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="courseSearch" placeholder="Search courses...">
    </div>
  </section>

  <div class="full-page-container">

    <!-- ================= FILTER SIDEBAR (left) ================= -->
    <aside class="filter-sidebar">

      <div class="filter-head">
        <h3 class="filter-title">Filter</h3>
        <button type="button" id="clearFilters" class="clear-btn">Clear all</button>
      </div>

      <!-- Search box that searches ONLY the filter list (not the courses) -->
      <div class="filter-search">
        <input type="text" id="filterSearch" placeholder="Search filters (MBA, B.Tech...)">
      </div>

      <!-- Tags (categories) – checkboxes are generated by explore.js -->
      <div class="filter-block">
        <h4>Category</h4>
        <div class="filter-group tag-list" id="tagFilterList"></div>
      </div>

      <!-- Language -->
      <div class="filter-block">
        <h4>Language</h4>
        <div class="filter-group" id="languageFilter">
          <label><input type="radio" name="language" value="" checked> All</label>
          <label><input type="radio" name="language" value="english"> English</label>
          <label><input type="radio" name="language" value="bengali"> Bengali</label>
          <label><input type="radio" name="language" value="hindi"> Hindi</label>
        </div>
      </div>

      <!-- Price -->
      <div class="filter-block">
        <h4>Price</h4>
        <div class="filter-group" id="paidFilter">
          <label><input type="radio" name="paid" value="" checked> All</label>
          <label><input type="radio" name="paid" value="false"> Free</label>
          <label><input type="radio" name="paid" value="true"> Paid</label>
        </div>
      </div>
    </aside>

    <!-- ================= CONTENT (right) ================= -->
    <main class="content-area">

      <div class="controls-bar">
        <!-- Video / Document tabs (same position as before) -->
        <div class="tabs">
          <button id="videoTab" class="tab-btn active" data-type="video">Videos</button>
          <button id="documentTab" class="tab-btn" data-type="document">Documents</button>
        </div>
        <span class="result-count" id="resultCount"></span>
      </div>

      <!-- Course cards are rendered here -->
      <div class="course-grid" id="courseGrid"></div>

      <!-- Empty / error message -->
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon">📚</div>
        <h3 id="emptyTitle">No courses found</h3>
        <p id="emptyText">Try changing your search or filters.</p>
      </div>

      <!-- Pagination -->
      <div class="load-more-wrap">
        <button id="loadMoreBtn" class="load-more-btn" hidden>Load more courses</button>
      </div>

    </main>
  </div>

  <script src="explore.js"></script>
</body>
</html>
