<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillHub - Explore Courses</title>
  <link rel="stylesheet" href="explore.css">
</head>
<body>

  <!-- Search -->
  <section class="search-section">
    <div class="search-box">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>

      <input type="text" placeholder="Search courses...">
    </div>
  </section>

  <!-- Main Layout -->
  <div class="full-page-container">
    

    <!-- Filter Sidebar -->
    <aside class="filter-sidebar">
      <h3 class="filter-title">Filter</h3>

      <div class="filter-group">
        <label><input type="checkbox"> Class 9-10</label>
        <label><input type="checkbox"> Class 11-12</label>
        <label><input type="checkbox"> Science</label>
        <label><input type="checkbox"> Mathematics</label>
      </div>
    </aside>

    <!-- Content -->
    <main class="content-area">

      <div class="controls-bar">

        <!-- Video / Document Tabs -->
        <div class="tabs">
          <button id="videoTab" class="tab-btn active">Videos</button>
          <span class="divider">|</span>
          <button id="documentTab" class="tab-btn">Documents</button>
        </div>

        <!-- Sort -->
        <div class="sort-box">
          <label for="sort">Sort</label>

          
        <select id="sort">
            <option value="newest">New</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
        </select>
        </div>

      </div>

      <!-- Backend Courses -->
      <div class="cards-grid" id="courseGrid"></div>

    </main>

  </div>

  <script src="explore.js"></script>

</body>
</html>
