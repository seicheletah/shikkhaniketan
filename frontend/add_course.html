<!--
==========================================================================
 add_course.html  -  Create New Course (HTML fragment)
 Opens INSIDE the teacher dashboard (teacher.html) via fetch().
 The sidebar / topbar / Settings section were removed from this file:
 the dashboard already provides them.
==========================================================================
-->

<link rel="stylesheet" href="teacher_pages.css">

<div class="tp-page" id="ac-wrapper">

    <!-- Back to the Teacher Dashboard (courses) page, inside the dashboard -->
    <button type="button" class="tp-back" id="acBackBtn"
            onclick="window.loadDashboardPage ? window.loadDashboardPage('teacher_courses.html') : (window.location.href = 'teacher.html')">
        <span class="tp-back-icon"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></span>
        Back to Courses
    </button>

    <header class="tp-head">
        <div>
            <h1 class="tp-title">Create New Course</h1>
            <p class="tp-subtitle">Fill in the details and upload your material.</p>
        </div>
    </header>

    <section class="tp-card">
        <form id="addCourseForm" class="tp-form" novalidate>

            <!-- course_name -->
            <div class="tp-field">
                <label class="tp-label" for="courseName">Course Name</label>
                <input type="text" id="courseName" class="tp-input" placeholder="Course Name">
            </div>

            <!-- course_details -->
            <div class="tp-field">
                <label class="tp-label" for="courseDetails">Course Details</label>
                <textarea id="courseDetails" class="tp-input" rows="4" placeholder="Course Description"></textarea>
            </div>

            <!-- language / type / price -->
            <div class="tp-grid-3">
                <div class="tp-field">
                    <label class="tp-label" for="language">Language</label>
                    <select id="language" class="tp-input">
                        <option value="" selected disabled>Select</option>
                        <option value="english">English</option>
                        <option value="bengali">Bengali</option>
                        <option value="hindi">Hindi</option>
                    </select>
                </div>

                <div class="tp-field">
                    <label class="tp-label" for="courseType">Type</label>
                    <select id="courseType" class="tp-input">
                        <option value="paid" selected>Paid</option>
                        <option value="free">Free</option>
                    </select>
                </div>

                <div class="tp-field">
                    <label class="tp-label" for="price">Price (INR)</label>
                    <input type="number" id="price" class="tp-input" min="1" placeholder="e.g. 1500">
                </div>
            </div>

            <!-- resource type -->
            <div class="tp-field">
                <label class="tp-label" for="resourceType">Resource Type</label>
                <select id="resourceType" class="tp-input">
                    <option value="" selected disabled>Select Resource Type</option>
                    <option value="video">Video</option>
                    <option value="document">Document</option>
                </select>
            </div>

            <!-- tags (searchable multi-select) -->
            <div class="tp-field">
                <label class="tp-label">Course Tags <span class="tp-hint">(choose one or more categories)</span></label>

                <div class="tp-tags" id="tagDropdown">
                    <button type="button" class="tp-tags-toggle" id="tagDropdownToggle">
                        <span id="tagDropdownLabel">Select tags</span>
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>

                    <div class="tp-tags-panel">
                        <input type="text" id="tagSearchInput" class="tp-tags-search" placeholder="Search tags (e.g. MBA, Python)...">
                        <div class="tp-tags-options" id="tagOptions"></div>
                    </div>
                </div>

                <div class="tp-chips" id="selectedTags"></div>
            </div>

            <!-- thumbnail -->
            <div class="tp-field">
                <span class="tp-label">Course Thumbnail</span>
                <label class="tp-upload" for="thumbnailInput">
                    <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                    <p id="thumbnailText">Click to Upload Thumbnail</p>
                </label>
                <input type="file" id="thumbnailInput" accept="image/png,image/jpeg" hidden>
            </div>

            <!-- course material -->
            <div class="tp-field">
                <span class="tp-label">Course Material</span>
                <label class="tp-upload" for="fileInput">
                    <i class="fa-solid fa-file-circle-plus" aria-hidden="true"></i>
                    <p id="fileText">Click to Upload Video / PDF</p>
                </label>
                <input type="file" id="fileInput" accept="video/mp4,application/pdf" hidden>
            </div>

            <div class="tp-actions">
                <button type="button" class="tp-btn tp-btn-light" id="acCancelBtn">Cancel</button>
                <button type="submit" class="tp-btn" id="acSubmitBtn">Submit</button>
            </div>
        </form>
    </section>
</div>

<script src="add_course.js"></script>
