<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Course - SkillHub</title>

    <!-- CSS -->
    <link rel="stylesheet" href="add_course.css">

    <!-- Font Awesome Icons & Fonts -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="dashboard-container">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-logo-box">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <h2 class="brand-name">
                    SkillHub
                </h2>

            </div>


            <nav class="nav-menu">

                <!-- COURSES -->
                <a href="#"
                   class="nav-item active"
                   data-page="courses">

                    <span>Courses</span>

                </a>


                <!-- SETTINGS -->
                <a href="#"
                   class="nav-item"
                   data-page="settings">

                    <span>Settings</span>

                </a>


                <!-- LOGOUT -->
                <a href="#"
                   class="nav-item logout"
                   data-page="logout">

                    <span>Logout</span>

                </a>

            </nav>

        </aside>



        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">


            <!-- ================= TOP BAR ================= -->

            <div class="top-bar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        placeholder="Search courses..."
                    >

                </div>


                <div class="top-bar-right">

                    <div class="user-profile">

                        <img
                            id="teacherProfileImg"
                            src="https://i.pravatar.cc/150?img=68"
                            alt="User Profile"
                        >

                        <span
                            class="user-name"
                            id="teacherUserName"
                        >
                            Alex Smit
                        </span>

                    </div>

                </div>

            </div>



            <!-- ================= CONTENT BODY ================= -->

            <div class="content-body">


                <!-- ================================================= -->
                <!-- COURSES SECTION -->
                <!-- ================================================= -->

                <section
                    class="page-section active"
                    id="courses"
                >

                    <div class="form-container">

                        <div class="form-card">

                            <h2 class="form-title">
                                Create New Course
                            </h2>


                            <form id="addCourseForm">


                                <!-- COURSE NAME -->

                                <div class="form-group">

                                    <label for="courseName">
                                        Course Name
                                    </label>

                                    <input
                                        type="text"
                                        id="courseName"
                                        name="courseName"
                                        placeholder="e.g. Complete Full-Stack Web Development"
                                        required
                                    >

                                </div>



                                <!-- COURSE DETAILS -->

                                <div class="form-group">

                                    <label for="courseDetails">
                                        Course Details
                                    </label>

                                    <textarea
                                        id="courseDetails"
                                        name="courseDetails"
                                        rows="4"
                                        placeholder="Enter detailed course description..."
                                        required
                                    ></textarea>

                                </div>



                                <!-- LANGUAGE, TYPE & PRICE -->

                                <div class="form-row three-cols">


                                    <!-- LANGUAGE -->

                                    <div class="form-group">

                                        <label for="language">
                                            Language
                                        </label>

                                        <select
                                            id="language"
                                            name="language"
                                            required
                                        >

                                            <option
                                                value=""
                                                disabled
                                                selected
                                            >
                                                Select Language
                                            </option>

                                            <option value="English">
                                                English
                                            </option>

                                            <option value="Bengali">
                                                Bengali
                                            </option>

                                            <option value="Hindi">
                                                Hindi
                                            </option>

                                        </select>

                                    </div>



                                    <!-- TYPE -->

                                    <div class="form-group">

                                        <label for="courseType">
                                            Type
                                        </label>

                                        <select
                                            id="courseType"
                                            name="courseType"
                                            onchange="togglePriceField(this.value)"
                                            required
                                        >

                                            <option
                                                value="paid"
                                                selected
                                            >
                                                Paid
                                            </option>

                                            <option value="free">
                                                Free
                                            </option>

                                        </select>

                                    </div>



                                    <!-- PRICE -->

                                    <div
                                        class="form-group"
                                        id="priceGroup"
                                    >

                                        <label for="price">
                                            Price (₹)
                                        </label>

                                        <input
                                            type="number"
                                            id="price"
                                            name="price"
                                            placeholder="2999"
                                            min="0"
                                        >

                                    </div>

                                </div>



                                <!-- ================= THUMBNAIL ================= -->

                                <div class="form-group">

                                    <label>
                                        Upload Thumbnail
                                    </label>


                                    <div
                                        class="upload-box"
                                        onclick="document.getElementById('thumbnailInput').click()"
                                    >

                                        <i class="fa-solid fa-cloud-arrow-up"></i>


                                        <p id="thumbnailText">
                                            Click or Drag & Drop course thumbnail image
                                        </p>


                                        <input
                                            type="file"
                                            id="thumbnailInput"
                                            accept="image/*"
                                            class="hidden-input"
                                            onchange="updateFileName(this, 'thumbnailText')"
                                        >

                                    </div>

                                </div>



                                <!-- ================= VIDEO / PDF ================= -->

                                <div class="form-group">

                                    <label>
                                        Upload File (Video / PDF Material)
                                    </label>


                                    <div
                                        class="upload-box"
                                        onclick="document.getElementById('fileInput').click()"
                                    >

                                        <i class="fa-solid fa-file-circle-plus"></i>


                                        <p id="fileText">
                                            Click or Drag & Drop course material (MP4, PDF)
                                        </p>


                                        <input
                                            type="file"
                                            id="fileInput"
                                            accept="video/*,application/pdf"
                                            class="hidden-input"
                                            onchange="updateFileName(this, 'fileText')"
                                        >

                                    </div>

                                </div>



                                <!-- ================= SUBMIT ================= -->

                                <div class="form-actions">

                                    <button
                                        type="submit"
                                        class="btn-submit"
                                    >
                                        Submit
                                    </button>

                                </div>


                            </form>

                        </div>

                    </div>

                </section>



                <!-- ================================================= -->
                <!-- SETTINGS SECTION -->
                <!-- ================================================= -->

                <section
                    class="page-section"
                    id="settings"
                >

                    <div id="accountDetails">

                        <!-- Teacher account details will load here -->

                    </div>

                </section>


            </div>

        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script src="add_course.js"></script>

</body>

</html>
