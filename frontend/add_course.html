<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Course - SkillHub</title>

    <link rel="stylesheet" href="add_course.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="dashboard-container">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-logo-box">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 class="brand-name">SkillHub</h2>
        </div>

        <nav class="nav-menu">

            <a href="#" class="nav-item active" data-page="courses">
                <span>Courses</span>
            </a>

            <a href="#" class="nav-item" data-page="settings">
                <span>Settings</span>
            </a>

            <a href="#" class="nav-item logout" data-page="logout">
                <span>Logout</span>
            </a>

        </nav>

    </aside>

    <!-- ================= MAIN ================= -->

    <main class="main-content">

        <!-- ================= TOP BAR ================= -->

        <div class="top-bar">

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search courses...">
            </div>

            <div class="top-bar-right">

                <div class="user-profile">

                    <img id="teacherProfileImg"
                         src="https://i.pravatar.cc/150?img=68"
                         alt="Teacher">

                    <span class="user-name" id="teacherUserName">
                        Teacher
                    </span>

                </div>

            </div>

        </div>

        <!-- ================= BODY ================= -->

        <div class="content-body">

            <!-- ===================================== -->
            <!-- COURSES -->
            <!-- ===================================== -->

            <section class="page-section active" id="courses">

                <div class="form-container">

                    <div class="form-card">

                        <h2 class="form-title">Create New Course</h2>

                        <form id="addCourseForm">

                            <div class="form-group">
                                <label>Course Name</label>
                                <input type="text"
                                       id="courseName"
                                       placeholder="Course Name"
                                       required>
                            </div>

                            <div class="form-group">
                                <label>Course Details</label>
                                <textarea id="courseDetails"
                                          rows="4"
                                          placeholder="Course Description"
                                          required></textarea>
                            </div>

                            <div class="form-row three-cols">

                                <div class="form-group">
                                    <label>Language</label>
                                    <select id="language" required>
                                        <option value="" selected disabled>
                                            Select
                                        </option>
                                        <option value="English">English</option>
                                        <option value="Bengali">Bengali</option>
                                        <option value="Hindi">Hindi</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Type</label>
                                    <select id="courseType"
                                            onchange="togglePriceField(this.value)"
                                            required>

                                        <option value="paid" selected>
                                            Paid
                                        </option>

                                        <option value="free">
                                            Free
                                        </option>

                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Price</label>
                                    <input type="number"
                                           id="price"
                                           placeholder="2999">
                                </div>

                            </div>

                            <div class="form-group">

                                <label>Course Thumbnail</label>

                                <div class="upload-box"
                                     onclick="document.getElementById('thumbnailInput').click()">

                                    <i class="fa-solid fa-cloud-arrow-up"></i>

                                    <p id="thumbnailText">
                                        Click to Upload Thumbnail
                                    </p>

                                    <input type="file"
                                           id="thumbnailInput"
                                           accept="image/*"
                                           hidden
                                           onchange="updateFileName(this)">

                                </div>

                            </div>

                            <div class="form-group">

                                <label>Course Material</label>

                                <div class="upload-box"
                                     onclick="document.getElementById('fileInput').click()">

                                    <i class="fa-solid fa-file-circle-plus"></i>

                                    <p id="fileText">
                                        Click to Upload Video / PDF
                                    </p>

                                    <input type="file"
                                           id="fileInput"
                                           accept="video/*,application/pdf"
                                           hidden
                                           onchange="updateFileName(this)">

                                </div>

                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-submit">
                                    Submit
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </section>

            <!-- ===================================== -->
            <!-- SETTINGS -->
            <!-- ===================================== -->

            <section class="page-section" id="settings">

                <div class="settings-page">

                    <div class="settings-header">
                        <h2>Account Settings</h2>
                        <p>Your account information</p>
                    </div>

                    <div class="account-details-card">

                        <h3>Account Details</h3>

                        <div class="account-details">

                            <div class="detail-row">
                                <span>First Name</span>
                                <strong id="teacherFirstName">-</strong>
                            </div>

                            <div class="detail-row">
                                <span>Last Name</span>
                                <strong id="teacherLastName">-</strong>
                            </div>

                            <div class="detail-row">
                                <span>Email</span>
                                <strong id="teacherEmail">-</strong>
                            </div>

                            <div class="detail-row">
                                <span>Phone</span>
                                <strong id="teacherPhone">-</strong>
                            </div>

                            <div class="detail-row">
                                <span>Gender</span>
                                <strong id="teacherGender">-</strong>
                            </div>

                            <div class="detail-row">
                                <span>Date of Birth</span>
                                <strong id="teacherDob">-</strong>
                            </div>

                            <div class="detail-row">
                                <span>Address</span>
                                <strong id="teacherAddress">-</strong>
                            </div>

                            <div class="detail-row">
                                <span>About Me</span>
                                <strong id="teacherAbout">-</strong>
                            </div>

                        </div>

                        <div class="update-profile-wrapper">

                            <button type="button"
                                    class="update-profile-option">

                                Update Profile

                                <i class="fa-solid fa-arrow-right"></i>

                            </button>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>

<script src="add_course.js"></script>

</body>
</html>
