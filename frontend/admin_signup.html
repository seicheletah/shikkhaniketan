<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skillhub - Admin Sign Up</title>

    <!-- Reuse the same styles as the Create Account page -->
    <link rel="stylesheet" href="create_account.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* Small "Already have an account?" text under the buttons */
        .login-text {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 18px;
        }

        .login-text a {
            color: #127c71;
            font-weight: 600;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Small hint text under the access token box */
        .token-hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <!-- Header Section: circular back arrow + logo (goes to index.html) -->
    <header>
        <a href="index.html" class="logo" aria-label="Back to home">
            <span class="back-arrow">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </span>
            <span>Skillhub</span>
        </a>
    </header>


    <!-- Main Content Container -->
    <main class="container">

        <!-- Left Section -->
        <section class="left-section">
            <h1>Learn. Grow. Succeed.</h1>

            <div class="illustration-container">
                <img src="picture.jpeg" alt="Student studying with interactive elements">
            </div>
        </section>


        <!-- Right Section -->
        <section class="right-section">

            <div class="form-card">

                <h2 id="formTitle">ADMIN SIGN UP</h2>


                <!-- STEP 1: Admin details form -->
                <form id="adminForm">

                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first_name" placeholder="First Name" required>
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last_name" placeholder="Last Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" id="createBtn">Continue</button>

                    <p class="login-text">
                        Already an admin? <a href="login.html">Log in</a>
                    </p>

                </form>


                <!-- STEP 2: Email OTP form (hidden until the admin account is created) -->
                <form id="otpForm" hidden>

                    <p class="otp-info" id="otpInfo">
                        We sent a verification code to your email.
                    </p>

                    <div class="form-group">
                        <label for="otp">Verification Code (OTP)</label>
                        <input type="text" id="otp" name="otp" placeholder="Enter OTP"
                            inputmode="numeric" autocomplete="one-time-code" required>
                    </div>

                    <button type="submit" id="verifyBtn">Verify OTP</button>

                </form>


                <!-- STEP 3: Admin access token form (hidden until the OTP is verified) -->
                <form id="tokenForm" hidden>

                    <p class="otp-info" id="tokenInfo">
                        Your email is verified. Enter the admin access token to continue.
                    </p>

                    <div class="form-group">
                        <label for="access-token">Admin Access Token</label>
                        <input type="text" id="access-token" name="access_token"
                            placeholder="Paste the access token" autocomplete="off" required>
                        <p class="token-hint">
                            This token is generated by an existing admin
                            (Admin Dashboard &rarr; Access Token &rarr; Generate).
                        </p>
                    </div>

                    <button type="submit" id="tokenBtn">Verify Token &amp; Finish</button>

                </form>

            </div>

        </section>

    </main>

    <script src="admin_signup.js"></script>

</body>

</html>
