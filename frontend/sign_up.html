<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillhub - Create Account</title>
    <link rel="stylesheet" href="sign_up.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Section: circular back arrow + logo (goes to index.html) -->
    <header>
        <a href="index.html" class="logo" aria-label="Back to home">
            <span class="back-arrow">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </span>
            <span>Skillhub</span>
        </a>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        <!-- Left Section: Heading & Illustration -->
        <section class="left-section">
            <h1>Learn. Grow. Succeed.</h1>
            <div class="illustration-container">
                <img src="picture.jpeg" alt="Student studying with interactive elements">
            </div>
        </section>

        <!-- Right Section: Form Box -->
        <section class="right-section">
            <div class="form-card">
                <h2>CREATE ACCOUNT</h2>

                <!-- Form Section -->
                <form id="signupForm">

                    <!-- Email Input -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <!-- Role Dropdown Input -->
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role" required>
                            <option value="" disabled selected hidden>Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="continue-btn">Continue</button>

                </form>
            </div>
        </section>
    </main>

    <script src="sign_up.js"></script>
</body>
</html>
