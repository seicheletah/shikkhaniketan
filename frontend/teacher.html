<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page scale correctly on mobile screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillHub - Teacher Dashboard</title>

    <!-- Main stylesheet for the whole teacher dashboard layout (sidebar + topbar) -->
    <link rel="stylesheet" href="teacher.css">

    <!-- FontAwesome: local copy first, CDN copy as backup (same as the student page) -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Root wrapper: sidebar on the left, main content on the right -->
    <div class="app-container">

        <!-- Hamburger button: only visible on mobile (<= 768px) -->
        <button class="mobile-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- ===================== SIDEBAR (fixed, green) ===================== -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap brand-icon"></i>
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h2>SkillHub</h2>
                </a>
            </div>

            <!-- Only 3 items for the teacher: Courses, Settings, Logout.
                 Links with "data-page" are loaded into the content area by teacher.js -->
            <nav class="nav-menu">
                <a href="teacher_courses.html" class="nav-link active" data-page="teacher_courses.html">
                    <span>Courses</span>
                </a>
                <a href="settings.html" class="nav-link" data-page="settings.html">
                    <span>Settings</span>
                </a>

                <!-- Logout: no "data-page" on purpose, teacher.js handles it by id -->
                <a href="#logout" class="nav-link" id="logoutBtn">
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Dark transparent backdrop shown behind the sidebar on mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ===================== MAIN AREA (topbar + content) ===================== -->
        <div class="main-wrapper">

            <!-- TOPBAR: welcome text on the left, profile picture on the right -->
            <header class="topbar">
                <div class="welcome-text">
                    Welcome to Teacher Dashboard,
                    <span class="user-name" id="teacherUserName">Teacher</span>
                </div>

                <div class="user-profile">
                    <img src="https://i.pravatar.cc/100?img=32" alt="User Profile" class="profile-img">
                </div>
            </header>

            <!-- Scrollable content area.
                 teacher_courses, add_course, edit_course, settings and update_profile
                 are all loaded here with fetch(). -->
            <main class="content-area" id="main-content">
            </main>
        </div>
    </div>

    <!-- Main dashboard logic (navigation, profile, logout) -->
    <script src="teacher.js"></script>
    <!-- Profile update logic (the SAME file the student page uses, unchanged) -->
    <script src="update_profile.js"></script>
</body>
</html>
