<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Profile - SkillHub</title>


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <!-- CSS -->

    <link rel="stylesheet"
          href="update_profile.css">

</head>


<body>


    <div class="update-page">


        


        <!-- PAGE INTRO -->

        <div class="page-intro">

            <div class="intro-icon">

                <i class="fa-solid fa-user-pen"></i>

            </div>

            <div class="intro-text">

                <span class="eyebrow">
                    ACCOUNT SETTINGS
                </span>

                <h1>
                    Update Profile
                </h1>

                <p>
                    Manage your personal information and keep your profile up to date.
                </p>

            </div>

        </div>



        <!-- FORM -->

        <form id="updateProfileForm">


            <!-- PERSONAL INFORMATION -->

            <section class="profile-card">


                <!-- CARD HEADER -->

                <div class="card-header">

                    <div class="header-icon">

                        <i class="fa-solid fa-user"></i>

                    </div>

                    <div>

                        <h2>
                            Personal Information
                        </h2>

                        <p>
                            Update your basic account information.
                        </p>

                    </div>

                </div>



                <!-- FORM -->

                <div class="form-grid">


                    <!-- FIRST NAME -->

                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <div class="field">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="firstName"
                                name="first_name"
                                placeholder="Enter first name"
                                required>

                        </div>

                    </div>



                    <!-- LAST NAME -->

                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <div class="field">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="lastName"
                                name="last_name"
                                placeholder="Enter last name"
                                required>

                        </div>

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group full-width">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="field locked-field">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Email address"
                                readonly>

                            <span class="lock-icon">

                                <i class="fa-solid fa-lock"></i>

                            </span>

                        </div>

                        <div class="field-note">

                            <i class="fa-solid fa-circle-info"></i>

                            Email address cannot be changed.

                        </div>

                    </div>



                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <div class="field">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="tel"
                                id="phone"
                                name="phone_no"
                                placeholder="Enter phone number">

                        </div>

                    </div>



                    <!-- GENDER -->

                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <div class="field">

                            <i class="fa-solid fa-venus-mars"></i>

                            <select
                                id="gender"
                                name="gender">

                                <option value="">
                                    Select Gender
                                </option>

                                <option value="m">
                                    Male
                                </option>

                                <option value="f">
                                    Female
                                </option>

                                <option value="o">
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>



                    <!-- DATE OF BIRTH -->

                    <div class="form-group">

                        <label for="dateOfBirth">
                            Date of Birth
                        </label>

                        <div class="field">

                            <i class="fa-regular fa-calendar"></i>

                            <input
                                type="date"
                                id="dateOfBirth"
                                name="date_of_birth">

                        </div>

                    </div>



                    <!-- ADDRESS -->

                    <div class="form-group full-width">

                        <label for="address">
                            Address
                        </label>

                        <div class="field textarea-field">

                            <i class="fa-solid fa-location-dot"></i>

                            <textarea
                                id="address"
                                name="address"
                                placeholder="Enter your address"
                                rows="3"></textarea>

                        </div>

                    </div>



                    <!-- ABOUT -->

                    <div class="form-group full-width">

                        <label for="about">
                            About Me
                        </label>

                        <div class="field textarea-field">

                            <i class="fa-regular fa-message"></i>

                            <textarea
                                id="about"
                                name="about"
                                placeholder="Write a short description about yourself"
                                rows="4"></textarea>

                        </div>

                    </div>


                </div>


            </section>



            <!-- ACTION AREA -->

            <div class="action-area">


                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="save-btn"
                    id="saveBtn">

                    <i class="fa-solid fa-check"></i>

                    Update Profile

                </button>


            </div>


        </form>


    </div>



    <script src="update_profile.js"></script>

</body>

</html>
