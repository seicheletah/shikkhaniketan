<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In</title>
    <link rel="stylesheet" href="ad_signin.css">
</head>
<body>

    <!-- Top Left Corner Title -->
    <div class="top-admin-title">Admin</div>

    

    
    

    <div class="container">
        <!-- Left Side: Image & Text -->
        <div class="left-panel">
            <div class="image-box">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to access your admin dashboard and manage your application seamlessly.</p>
        </div>

        <!-- Right Side: Sign In Box -->
        <div class="right-panel">
            <h1 class="form-title">sign in</h1>
            <form class="signin-form" id="adminForm">

    <div class="input-group">
        <input type="text" id="firstName"
               placeholder="First name" required>
    </div>

    <div class="input-group">
        <input type="text" id="lastName"
               placeholder="Last name" required>
    </div>

    <div class="input-group">
        <input type="email" id="email"
               placeholder="Email address" required>
    </div>

    <div class="input-group">
        <input type="password" id="password"
               placeholder="Password" required>
    </div>

    <div class="btn-group">
        
        <button type="submit" class="submit-btn">
            OK
        </button>
    </div>

    

</form>
        </div>
    </div>
    <script src="ad_signin.js"></script>

</body>
</html>
