<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
    <!-- FontAwesome Icons for UI -->
    <link rel="stylesheet" href="">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            
            <h2>admin</h2>
        </div>
        <nav>
            <div class="nav-section-title"></div>
            <a href="#" class="active"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="#"><i class="fa-solid fa-users"></i> User Management</a>
            <a href="#"><i class="fa-solid fa-graduation-cap"></i> Student Management</a>
            <a href="#"><i class="fa-solid fa-chalkboard-user"></i> Teacher Management</a>
            <a href="#"><i class="fa-solid fa-book-open"></i> Course Management</a>
            <a href="#"><i class="fa-solid fa-star"></i> Review Management</a>
            <a href="#"><i class="fa-solid fa-cart-shopping"></i> Purchase Management</a>
            <a href="#"><i class="fa-solid fa-clock-rotate-left"></i> Action History</a>
            <a href="#"><i class="fa-solid fa-key"></i> Access Token</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="navbar">
            <div class="navbar-left">
                <!-- Requested Home Button -->
                
                <!-- Search Bar -->
                
            </div>

            <div class="navbar-right">
                <button class="icon-btn"><i class="fa-regular fa-moon"></i></button>
                <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                <button class="icon-btn"><i class="fa-regular fa-envelope"></i></button>
                
                <div class="user-profile">
                    <span>User Name</span>
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main class="dashboard-content">
            <div class="page-title">
                
               
            </div>

            <!-- Metrics Cards Grid -->
            <div class="metrics-grid">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">TOTAL STUDENTS</span>
                        <div class="card-icon student-icon"><i class="fa-solid fa-users"></i></div>
                    </div>
                    <div class="count">1,248</div>
                    <span class="badge positive">+12% vs last month</span>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="card-title">TOTAL TEACHERS</span>
                        <div class="card-icon teacher-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                    </div>
                    <div class="count">84</div>
                    <span class="badge positive">+4 new this week</span>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="card-title">TOTAL COURSES</span>
                        <div class="card-icon course-icon"><i class="fa-solid fa-book-open"></i></div>
                    </div>
                    <div class="count">42</div>
                    <span class="badge neutral">2 pending review</span>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
