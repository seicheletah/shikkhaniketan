<link rel="stylesheet" href="courses.css">

<div class="courses-page">

  <!-- Search -->
  <section class="course-search-section">
    <div class="course-search-box">
      <svg class="course-search-icon" xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>

      <input type="text" id="courseSearch" placeholder="Search courses...">
    </div>
  </section>

  <!-- Content -->
  <div class="courses-content">

    <div class="controls-bar">

      <!-- Video / Document Tabs (modern segmented control) -->
      <div class="tabs">

        <button id="videoTab" class="tab-btn active" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="10 8 16 12 10 16 10 8"></polygon>
          </svg>
          Videos
        </button>

        <button id="documentTab" class="tab-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="13" y2="17"></line>
          </svg>
          Documents
        </button>

      </div>

      <!-- Sort -->
      <div class="sort-box">
        <label for="sort">Sort</label>

        <select id="sort">
          <option value="all">All</option>
          <option value="paid">Paid</option>
          <option value="free">Free</option>
          <option value="newest">Newest</option>
        </select>
      </div>

    </div>

    <!-- Recommended for You -->
    <h2 class="section-heading">Recommended for You</h2>
    <div class="cards-grid" id="courseGrid"></div>

    <!-- Enrolled Courses (শুধু লগইন করা student দেখবে) -->
    <div class="enrolled-section hidden" id="enrolledSection">
      <h2 class="section-heading">Enrolled Courses</h2>
      <div class="cards-grid" id="enrolledGrid"></div>
    </div>

  </div>

</div>

<script src="courses.js"></script>
