<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SkillHub - Course Details</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="course_details.css?v=4">
</head>
<body>

<div class="course-details-page">
    <div class="cd-layout">

        <!-- ================= HEAD: Title, Description & Rating Summary ================= -->
        <header class="cd-head">
            <h1 class="cd-title" id="cdTitle">Loading Course...</h1>
            <p class="cd-description" id="cdDetails">Course description will load here...</p>
            <div class="cd-rating-line">
                <span class="cd-stars" id="cdTopStars"></span>
                <span id="cdTopRatingText">No ratings yet</span>
            </div>
        </header>

        <!-- ================= PURCHASE CARD ================= -->
        <aside class="cd-card">
            <div class="cd-thumb loading" id="cdThumb">
                <img id="cdThumbImg" alt="Course thumbnail" hidden>
                <div class="cd-thumb-placeholder" id="cdThumbPlaceholder">
                    <i class="fa-regular fa-image"></i>
                </div>
            </div>

            <div class="cd-card-body">
                <div class="price-breakdown">
                    <div class="price-row">
                        <span>Course Price</span>
                        <strong id="cdPrice">₹0</strong>
                    </div>
                    <hr class="cd-divider">
                    <div class="price-row total">
                        <span>Total</span>
                        <strong id="cdTotal">₹0</strong>
                    </div>
                </div>

                <button class="btn-purchase" id="cdPurchaseBtn" type="button">Purchase</button>
            </div>
        </aside>

        <!-- ================= BODY: Rating Breakdown & Student Reviews ================= -->
        <main class="cd-body">
            <section class="cd-section">
                <h2 class="cd-section-title">Student ratings</h2>
                <div class="cd-rating-box">
                    <div class="cd-rating-main">
                        <div class="cd-avg-number" id="cdAvgNumber">0.0</div>
                        <div class="cd-stars cd-stars-lg" id="cdAvgStars"></div>
                        <span class="cd-total-reviews" id="cdTotalReviews">0 reviews</span>
                    </div>
                    <div class="cd-bars" id="cdBars"></div>
                </div>
            </section>

            <section class="cd-section">
                <h2 class="cd-section-title">Student reviews</h2>
                <p class="cd-review-note">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Only students who purchased this course can write a review. After purchase, open the course and use the review form.</span>
                </p>
                <div id="cdReviewList">
                    <p class="cd-empty">Loading reviews...</p>
                </div>
            </section>
        </main>

    </div>
</div>

<script>
    (function () {
        var API_BASE = 'api/v1';
        var TOKEN_KEY = 'access_token';
        var ROLE_KEY = 'userRole';
        var PENDING_KEY = 'pending_course';
        var LOGIN_PAGE = 'login.html';
        var STUDENT_PAGE = 'student.html';

        var mainContent = document.getElementById('main-content');
        var inDashboard = !!mainContent;

        var params = new URLSearchParams(window.location.search);
        var urlCourseId = params.get('id');
        var teacherView = params.get('view') === 'teacher';
        var autoPurchase = params.get('autopurchase') === '1';

        if (!inDashboard && urlCourseId) {
            localStorage.setItem('selected_course_id', urlCourseId);
        }

        function role() { return localStorage.getItem(ROLE_KEY); }
        function isLoggedIn() { return !!localStorage.getItem(TOKEN_KEY); }
        function isStudent() { return isLoggedIn() && role() === 'student'; }
        function isTeacher() { return isLoggedIn() && role() === 'teacher'; }

        function dashboardPage() {
            if (role() === 'teacher') return 'teacher.html';
            if (role() === 'admin') return 'admin.html';
            return STUDENT_PAGE;
        }

        function savePendingCourse(extra) {
            var id = localStorage.getItem('selected_course_id');
            if (!id) return;
            var data = { id: id, time: Date.now() };
            for (var key in (extra || {})) { data[key] = extra[key]; }
            localStorage.setItem(PENDING_KEY, JSON.stringify(data));
        }

        function checkEnrolled(courseId) {
            return fetch(API_BASE + '/students/me', {
                headers: { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) }
            })
                .then(function (res) { return res.ok ? res.json() : null; })
                .then(function (data) {
                    return !!data && JSON.stringify(data).indexOf(String(courseId)) !== -1;
                })
                .catch(function () { return false; });
        }

        // Ensure dashboard scroll container never clips bottom on mobile
        if (inDashboard) {
            mainContent.style.overflowY = 'auto';
            mainContent.style.webkitOverflowScrolling = 'touch';
        } else {
            window.loadDashboardPage = function (page) {
                if (String(page).indexOf('course_view') !== -1) {
                    savePendingCourse({ enrolled: true });
                    window.location.href = STUDENT_PAGE;
                } else {
                    window.location.href = page;
                }
            };
        }

        // Capture-phase click guard for Purchase / Start Learning
        if (window.__cdGuardHandler) {
            document.removeEventListener('click', window.__cdGuardHandler, true);
        }

        window.__cdGuardHandler = function (e) {
            if (!e.target.closest('#cdPurchaseBtn')) return;

            if (teacherView && isTeacher()) {
                e.preventDefault();
                e.stopImmediatePropagation();
                return;
            }

            if (!isLoggedIn()) {
                e.preventDefault();
                e.stopImmediatePropagation();
                savePendingCourse({ purchase: true });
                window.location.href = LOGIN_PAGE;
                return;
            }

            if (!isStudent()) {
                e.preventDefault();
                e.stopImmediatePropagation();

                var ok = window.confirm(
                    'You are logged in as a ' + (role() || 'different user') + '. ' +
                    'To purchase a course you need a student account. ' +
                    'Log out and log in as a student?'
                );

                if (ok) {
                    savePendingCourse({ purchase: true });
                    localStorage.removeItem(TOKEN_KEY);
                    localStorage.removeItem('token_type');
                    localStorage.removeItem(ROLE_KEY);
                    window.location.href = LOGIN_PAGE;
                }
            }
        };

        document.addEventListener('click', window.__cdGuardHandler, true);

        // Teacher viewing their own course
        if (teacherView && isTeacher()) {
            var purchaseBtn = document.getElementById('cdPurchaseBtn');
            if (purchaseBtn) {
                purchaseBtn.style.display = 'none';
                var note = document.createElement('p');
                note.textContent = 'This is your own course. Teachers cannot purchase courses.';
                note.style.cssText = 'margin:0 0 6px;padding:12px;border-radius:10px;background:#e6f4f2;' +
                    'color:#0d6860;font-size:14px;font-weight:600;text-align:center;';
                purchaseBtn.parentNode.insertBefore(note, purchaseBtn);
            }
        }

        // Standalone public mode (opened from index.html or explore.html)
        if (!inDashboard) {
            var style = document.createElement('style');
            style.textContent =
                'html{margin:0;padding:0;width:100%;height:auto;overflow-y:auto;background:#eef7f4;}' +
                'body{margin:0;padding:0;width:100%;min-height:100dvh;height:auto;overflow-x:hidden;overflow-x:clip;background:#eef7f4;font-family:"Segoe UI",Arial,sans-serif;}' +
                '.cd-public-bar,.cd-public-bar *{box-sizing:border-box;}' +
                '.cd-public-bar{position:sticky;top:0;left:0;right:0;z-index:100;width:100%;height:66px;display:flex;align-items:center;' +
                'justify-content:space-between;gap:10px;padding:0 5%;background:#fff;box-shadow:0 2px 10px rgba(9,104,88,.10);}' +
                '.cd-public-brand{display:inline-flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:#17384d;' +
                'font-size:23px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;}' +
                '.cd-public-brand img{width:36px;height:36px;flex-shrink:0;object-fit:contain;}' +
                '.cd-public-auth{display:flex;align-items:center;gap:14px;flex-shrink:0;}' +
                '.cd-public-login{text-decoration:none;color:#17384d;font-weight:600;font-size:15px;white-space:nowrap;}' +
                '.cd-public-signup{text-decoration:none;background:#159b91;color:#fff;padding:9px 18px;' +
                'border-radius:22px;font-weight:600;font-size:14px;white-space:nowrap;}' +
                '.cd-public-signup:hover{background:#0f766e;}' +
                '.course-details-page{max-width:1200px;margin:0 auto;padding:24px 20px 80px;}' +
                '@media(max-width:560px){' +
                '.cd-public-bar{height:58px;padding:0 12px;gap:6px;}' +
                '.cd-public-brand{font-size:18px;gap:7px;}' +
                '.cd-public-brand img{width:30px;height:30px;}' +
                '.cd-public-auth{gap:8px;}' +
                '.cd-public-login{font-size:13.5px;}' +
                '.cd-public-signup{padding:7px 13px;font-size:12.5px;}' +
                '.course-details-page{padding:16px 14px calc(110px + env(safe-area-inset-bottom,0px));}' +
                '}';
            document.head.appendChild(style);

            var rightSide = isLoggedIn()
                ? '<a href="' + dashboardPage() + '" class="cd-public-signup">My Dashboard</a>'
                : '<a href="login.html" class="cd-public-login">Log In</a>' +
                  '<a href="sign_up.html" class="cd-public-signup">Sign Up</a>';

            var bar = document.createElement('header');
            bar.className = 'cd-public-bar';
            bar.innerHTML =
                '<a href="index.html" class="cd-public-brand">' +
                '<img src="skillhublogo.jpeg" alt="SkillHub logo"><span>SkillHub</span></a>' +
                '<div class="cd-public-auth">' + rightSide + '</div>';
            document.body.prepend(bar);

            if (isStudent()) {
                var pageRoot = document.querySelector('.course-details-page');
                var courseId = localStorage.getItem('selected_course_id');

                if (pageRoot) pageRoot.style.visibility = 'hidden';

                checkEnrolled(courseId).then(function (enrolled) {
                    if (enrolled) {
                        savePendingCourse({ enrolled: true });
                        window.location.replace(STUDENT_PAGE);
                        return;
                    }

                    if (pageRoot) pageRoot.style.visibility = '';
                    if (autoPurchase) runAutoPurchase(courseId);
                });
            }
        }

        function runAutoPurchase(courseId) {
            window.history.replaceState(
                null, '', window.location.pathname + '?id=' + encodeURIComponent(courseId)
            );

            var tries = 0;
            var timer = setInterval(function () {
                tries++;
                var title = document.getElementById('cdTitle');
                var button = document.getElementById('cdPurchaseBtn');
                var text = title ? title.textContent : '';
                var loaded = text.indexOf('Loading Course') === -1;
                var failed = text.indexOf('failed') !== -1 || text.indexOf('not found') !== -1;

                if (loaded && button) {
                    clearInterval(timer);
                    if (!failed) button.click();
                } else if (tries > 50) {
                    clearInterval(timer);
                }
            }, 200);
        }
    })();
</script>

<script src="course_details.js?v=4"></script>
</body>
</html>
