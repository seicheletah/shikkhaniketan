<link rel="stylesheet" href="course_details.css">

<div class="course-details-page">

    <button class="cd-back-btn" id="cdBackBtn">
        <i class="fa-solid fa-arrow-left"></i> Back to Courses
    </button>

    <div class="course-detail-layout">

        <!-- LEFT -->
        <div class="left-column">

            <!-- Media -->
            <div class="media-viewer disabled">
                <div class="disabled-overlay">
                    <i class="fa-solid fa-lock"></i>
                    <p>Purchase this course to unlock videos &amp; documents</p>
                </div>
            </div>

            <!-- Overview / Reviews -->
            <div class="overview-review-card">

                <div class="tabs-header">
                    <button class="cd-tab-btn active" data-tab="overview">Overview</button>
                    <button class="cd-tab-btn" data-tab="reviews">Reviews</button>
                </div>

                <!-- Overview -->
                <div class="cd-tab-content" id="overviewTab">
                    <h3>Course Overview</h3>
                    <p id="cdDetails">Course description will load here...</p>

                    <ul class="course-highlights">
                        <li><i class="fa-solid fa-check"></i> HD Learning Content</li>
                        <li><i class="fa-solid fa-check"></i> Lifetime Access</li>
                        <li><i class="fa-solid fa-check"></i> Certificate Included</li>
                    </ul>
                </div>

                <!-- Reviews -->
                <div class="cd-tab-content hidden" id="reviewsTab">
                    <h3>Student Reviews</h3>
                </div>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="right-column">

            <div class="purchase-card">

                <h3 class="course-title" id="cdTitle">Loading Course...</h3>

                <div class="price-breakdown">

                    <div class="price-row">
                        <span>Course Price</span>
                        <strong id="cdPrice">₹0</strong>
                    </div>

                    <div class="price-row">
                        <span>GST (18%)</span>
                        <strong id="cdGst">₹0</strong>
                    </div>

                    <hr class="cd-divider">

                    <div class="price-row total">
                        <span>Total</span>
                        <strong id="cdTotal">₹0</strong>
                    </div>

                </div>

                <button class="btn-purchase" id="cdPurchaseBtn">Purchase</button>

            </div>

        </div>

    </div>

</div>

<script src="course_details.js"></script>
