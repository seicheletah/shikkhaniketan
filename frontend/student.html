<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page scale correctly on mobile screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillHub - Dashboard</title>

    <!-- Main stylesheet for the whole dashboard layout -->
    <link rel="stylesheet" href="student.css">

    <!-- FontAwesome: icon library used for the menu button, logo, etc.
         1) LOCAL copy first (folder "fontawesome" next to this file).
            It works even without internet and can not be blocked.
         2) CDN copy second, used as a backup if the local folder is missing.
         If a file is missing the browser simply ignores it, so having both is safe. -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Root wrapper: sidebar on the left, main content on the right -->
    <div class="app-container">

        <!-- Hamburger button: only visible on mobile (<= 768px) to open/close the sidebar -->
        <button class="mobile-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- ===================== SIDEBAR (fixed, green) ===================== -->
        <aside class="sidebar" id="sidebar">
            <!-- Logo + site name; clicking it goes to the home page -->
            <div class="brand">
                <i class="fa-solid fa-graduation-cap brand-icon"></i>
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h2>SkillHub</h2>
                </a>
            </div>

            <!-- Navigation menu.
                 Links with a "data-page" attribute load that page inside the
                 content area via JavaScript (no full page reload). -->
            <nav class="nav-menu">
                <a href="courses.html" class="nav-link active" data-page="courses.html">
                    <span>Courses</span>
                </a>
                <a href="quiz.html" class="nav-link" data-page="quiz.html">
                    <span>Quiz</span>
                </a>
                <a href="settings.html" class="nav-link" data-page="settings.html">
                    <span>Settings</span>
                </a>

                <!-- Transactions link.
                     It sits between Settings and Logout. Because it has a
                     "data-page" attribute, student.js loads transactions.html
                     into the content area with fetch(), just like Courses,
                     Quiz and Settings. -->
                <a href="transactions.html" class="nav-link" data-page="transactions.html">
                    <span>Transactions</span>
                </a>

                <!-- Logout link:
                     - It has NO "data-page" attribute on purpose, so the page-loader
                       in student.js ignores it.
                     - It has its own id so student.js can attach the logout logic. -->
                <a href="#logout" class="nav-link" id="logoutBtn">
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Dark transparent backdrop shown behind the sidebar on mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ===================== MAIN AREA (topbar + content) ===================== -->
        <div class="main-wrapper">

            <!-- TOPBAR: welcome text on the left, profile picture on the right -->
            <header class="topbar">
                <!-- LEFT SIDE: "Welcome to Student Dashboard, <name>"
                     The <span> with id="studentUserName" is filled with the
                     real first name by student.js after the profile loads.
                     "Student" is just the fallback shown until then. -->
                <div class="welcome-text">
                    Welcome to Student Dashboard,
                    <span class="user-name" id="studentUserName">Student</span>
                </div>

                <!-- RIGHT SIDE: profile picture.
                     The src below is only a neutral placeholder (inline image,
                     no download). student.js replaces it with the uploaded photo,
                     or with the male / female default avatar. -->
                <div class="user-profile">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23e3f3ee'/%3E%3Ccircle cx='100' cy='80' r='30' fill='%23096858'/%3E%3Cpath d='M40 200C40 140 70 124 100 124S160 140 160 200Z' fill='%23096858'/%3E%3C/svg%3E"
                         alt="User Profile" class="profile-img">
                </div>
            </header>

            <!-- Scrollable content area.
                 Other pages (courses, quiz, settings, transactions) are loaded here with fetch(). -->
            <main class="content-area" id="main-content">
            </main>
        </div>
    </div>

    <!-- Main dashboard logic (navigation, profile, logout) -->
    <script src="student.js"></script>
    <!-- Profile update logic (unchanged) -->
    <script src="update_profile.js"></script>
</body>
</html>
