<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillHub - Dashboard</title>
    <link rel="stylesheet" href="student.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- মোবাইলের জন্য মেনু বাটন -->
        <button class="mobile-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- ফিক্সড সবুজ সাইডবার -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap brand-icon"></i>
                <h2>SkillHub</h2>
            </div>
            
            <nav class="nav-menu">
                <a href="courses.html" class="nav-link active" data-page="courses.html">
                    <span>Courses</span>
                </a>
                <a href="quiz.html" class="nav-link" data-page="quiz.html">
                    <span>Quiz</span>
                </a>
                <a href="settings.html" class="nav-link" data-page="settings.html">
                    <span>Settings</span>
                </a>
                <a href="#logout" class="nav-link" data-page="logout">
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- মোবাইলের জন্য ব্যাকড্রপ ব্যাকগ্রাউন্ড -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- প্রধান কন্টেন্ট ও টপবার র‍্যাপার -->
        <div class="main-wrapper">
            <!-- ফিক্সড টপবার -->
            <header class="topbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Search your courses...">
                </div>
                <marquee> Welcome, to your dashboard, <span class="user-name" id="studentUserName">Student</span>
                          
                </marquee>
                <div class="user-profile">
                    <img src="https://i.pravatar.cc/100?img=32" alt="User Profile" class="profile-img">
                    
                </div>
            </header>

            <!-- স্ক্রোলযোগ্য মেইন কন্টেন্ট এরিয়া (লাল বর্ডারযুক্ত অংশ) -->
            <main class="content-area" id="main-content">
                <!-- Fetch API-এর মাধ্যমে এখানে আলাদা আলাদা পেজ লোড হবে -->
            </main>
        </div>
    </div>
   
    <script src="student.js"></script>
    <script src="update_profile.js"></script>
</body>
</html>
