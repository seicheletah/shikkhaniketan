<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shikkhaniketan - Login</title>
  
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="logo">Skillhub</div>
    <nav>
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    
    <!-- Left Section: Heading & Illustration -->
    <section class="left-section">
      <h1 class="hero-title">Learn. Grow. Succeed.</h1>
      
      <div class="illustration-container">
        <img src="picture.jpeg" alt="Shikkhaniketan Learning Illustration">
      </div>
    </section>

    <!-- Right Section: Form Box -->
    <section class="right-section">
      <div class="form-card">
        <h2>LOGIN</h2>

        <form id="loginForm">
          <!-- Email Input Field -->
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-box">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
          </div>

          <!-- Password Input Field -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-box">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
            </div>
          </div>

          <div class="forgot-link-wrapper">
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Log In Button -->
          <button type="submit" class="continue-btn">Log In</button>

          <!-- Sign Up Link -->
          <p class="signup-text">
            Don't have an account? <a href="sign_up.html">Sign up</a>
          </p>
        </form>
      </div>
    </section>

  </main>

  <script src="login.js"></script>
</body>
</html>
