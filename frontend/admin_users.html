<!-- ==========================================================
     USER MANAGEMENT PAGE (loaded inside admin.html with fetch)
     APIs: GET    /admin/users?last_id=&limit=
           PATCH  /admin/users/{id}   { email_id, hashed_password }
           DELETE /admin/users/{id}
     ========================================================== -->
<style>
    .um-box { background:#fff; border:1px solid #e5e9f0; border-radius:12px; padding:20px; }
    .um-bar { display:flex; gap:12px; margin-bottom:16px; }
    .um-search { flex:1; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; outline:none; }
    .um-search:focus { border-color:#0f766e; }
    .um-wrap { overflow-x:auto; }
    table.um-table { width:100%; border-collapse:collapse; font-size:14px; }
    table.um-table th { text-align:left; padding:10px 12px; font-size:12px; text-transform:uppercase; color:#475f7b; border-bottom:1px solid #e5e9f0; white-space:nowrap; }
    table.um-table td { padding:10px 12px; border-bottom:1px solid #eef1f6; vertical-align:middle; }
    .um-btn { border:0; border-radius:8px; padding:8px 14px; font-weight:600; font-size:13px; cursor:pointer; background:#0f766e; color:#fff; }
    .um-btn.edit { background:#e0f2fe; color:#075985; }
    .um-btn.del { background:#fee2e2; color:#991b1b; }
    .um-btn.light { background:#e2e8f0; color:#0f172a; }
    .um-btn:disabled { opacity:.6; cursor:not-allowed; }
    .um-role { background:#ccfbf1; color:#0f766e; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; text-transform:capitalize; }
    .um-more { text-align:center; margin-top:16px; }

    /* Edit popup */
    .um-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; align-items:center; justify-content:center; padding:16px; }
    .um-modal.open { display:flex; }
    .um-card { background:#fff; border-radius:14px; padding:24px; width:100%; max-width:400px; }
    .um-card h3 { margin-bottom:14px; }
    .um-card label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; }
    .um-card input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; }
    .um-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
</style>

<h1 class="page-title">User Management</h1>

<div class="um-box">
    <div class="um-bar">
        <input class="um-search" id="umSearch" type="text" placeholder="Search by email or role...">
    </div>
    <div class="um-wrap">
        <table class="um-table">
            <thead>
                <tr><th>Email</th><th>Role</th><th>Verified</th><th>Created</th><th>Actions</th></tr>
            </thead>
            <tbody id="umBody"><tr><td colspan="5">Loading...</td></tr></tbody>
        </table>
    </div>
    <div class="um-more"><button class="um-btn light" id="umMore" style="display:none;">Load more</button></div>
</div>

<!-- Edit user popup -->
<div class="um-modal" id="umModal">
    <div class="um-card">
        <h3>Edit User</h3>
        <label for="umEmail">Email</label>
        <input type="email" id="umEmail">
        <label for="umPassword">New password (leave empty to keep the old one)</label>
        <input type="password" id="umPassword" placeholder="New password">
        <div class="um-actions">
            <button class="um-btn light" id="umCancel">Cancel</button>
            <button class="um-btn" id="umSave">Save</button>
        </div>
    </div>
</div>

<script>
(function () {
    const API = 'http://127.0.0.1:8000/api/v1';
    const LIMIT = 50;
    let users = [];          // all users loaded so far
    let hasMore = false;     // true if another page may exist
    let editingId = null;    // id of the user inside the edit popup

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function api(path, options = {}) {
        const res = await fetch(API + path, {
            ...options,
            headers: {
                'Accept': 'application/json',
                ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                'Authorization': 'Bearer ' + localStorage.getItem('access_token')
            }
        });
        if (res.status === 401 && typeof logoutUser === 'function') { logoutUser(); return null; }
        const data = await res.json().catch(() => ({}));   // DELETE returns 204 (no body)
        if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : (data.detail && data.detail[0] ? data.detail[0].msg : 'Request failed (' + res.status + ')'));
        return data;
    }

    // ---------- Table ----------
    function render() {
        const q = $('umSearch').value.trim().toLowerCase();
        const rows = users.filter(u => !q || (u.email_id || '').toLowerCase().includes(q) || (u.role || '').toLowerCase().includes(q));
        $('umBody').innerHTML = rows.length ? rows.map(u => `
            <tr>
                <td>${esc(u.email_id)}</td>
                <td><span class="um-role">${esc(u.role)}</span></td>
                <td>${u.is_verified ? 'Yes' : 'No'}</td>
                <td>${esc(u.created_at ? new Date(u.created_at).toLocaleDateString() : '-')}</td>
                <td>
                    <button class="um-btn edit" data-action="edit" data-id="${esc(u.id)}">Edit</button>
                    <button class="um-btn del" data-action="delete" data-id="${esc(u.id)}">Delete</button>
                </td>
            </tr>`).join('') : '<tr><td colspan="5">No users found.</td></tr>';
        $('umMore').style.display = hasMore ? 'inline-block' : 'none';
    }

    // Loads the next page (cursor = id of the last user already loaded)
    async function loadUsers(reset) {
        if (reset) { users = []; }
        const lastId = users.length ? users[users.length - 1].id : null;
        try {
            const list = await api(`/admin/users?limit=${LIMIT}` + (lastId ? `&last_id=${lastId}` : ''));
            if (!list) return;
            users = users.concat(list);
            hasMore = list.length === LIMIT;
            render();
        } catch (e) {
            $('umBody').innerHTML = '<tr><td colspan="5" style="color:#d9534f;">' + esc(e.message) + '</td></tr>';
        }
    }

    // ---------- Edit / Delete ----------
    $('umBody').addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const user = users.find(u => String(u.id) === btn.dataset.id);
        if (!user) return;

        if (btn.dataset.action === 'edit') {
            editingId = user.id;
            $('umEmail').value = user.email_id || '';
            $('umPassword').value = '';
            $('umModal').classList.add('open');
        }

        if (btn.dataset.action === 'delete') {
            if (!confirm('Delete ' + user.email_id + '? This cannot be undone.')) return;
            btn.disabled = true;
            try {
                await api('/admin/users/' + user.id, { method: 'DELETE' });
                users = users.filter(u => u.id !== user.id);
                render();
            } catch (err) { alert(err.message); btn.disabled = false; }
        }
    });

    $('umCancel').addEventListener('click', () => $('umModal').classList.remove('open'));

    $('umSave').addEventListener('click', async () => {
        const email = $('umEmail').value.trim();
        const password = $('umPassword').value;
        if (!email) { alert('Email cannot be empty.'); return; }

        const body = { email_id: email };
        if (password) body.hashed_password = password;   // only sent when changed

        const btn = $('umSave');
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
            const updated = await api('/admin/users/' + editingId, { method: 'PATCH', body: JSON.stringify(body) });
            if (updated) users = users.map(u => u.id === editingId ? { ...u, ...updated } : u);
            $('umModal').classList.remove('open');
            render();
        } catch (err) { alert(err.message); }
        btn.disabled = false; btn.textContent = 'Save';
    });

    $('umSearch').addEventListener('input', render);
    $('umMore').addEventListener('click', () => loadUsers(false));

    loadUsers(true);
})();
</script>
