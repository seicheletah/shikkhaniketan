<!--
==========================================================================
 settings.html  -  Profile (read-only view)  -  shared by STUDENT and TEACHER
==========================================================================
 NEW: the page title is now chosen automatically.
   - opened inside student.html  ->  "Student Profile"
   - opened inside teacher.html  ->  "Teacher Profile"
 The small script at the bottom looks at which dashboard is hosting this
 page (teacher.html has an element with id="teacherUserName", student.html
 has id="studentUserName") and writes the right title.

 DESIGN NOTE
   This page and update_profile.html share ONE design language:
     - same page title area (title + subtitle)
     - same white card with a green banner on top
     - same big round profile picture overlapping the banner
     - same icon-badge tiles for every detail / field
     - same green gradient buttons

 RULES (do not break the JavaScript)
   1. Every id="disp-..." is filled by the dashboard JS (student.js /
      teacher.js). Do NOT rename or remove any id.
   2. This is an HTML fragment (no <html>/<head>/<body>) because the
      dashboard injects it with fetch().
   3. The dashboards re-create <script> tags after injecting a page, so the
      small script at the bottom DOES run.
   4. Font Awesome ("fa-solid" icons) must be loaded by the dashboard,
      as it already is.
==========================================================================
-->

<link rel="stylesheet" href="settings.css">

<!-- Outer wrapper: every CSS rule of this page is scoped to #settings-wrapper -->
<div id="settings-wrapper">

    <!-- Page title area (same structure as on the Update Profile page) -->
    <header class="pf-page-head">
        <!-- id="disp-page-title": the text is replaced by the script at the bottom -->
        <h1 class="pf-title" id="disp-page-title">Student Profile</h1>
        <p class="pf-subtitle">Your personal details at a glance.</p>
    </header>

    <!-- Main card -->
    <section class="profile-card">

        <!-- Green banner behind the picture (purely decorative) -->
        <div class="pf-banner" aria-hidden="true"></div>

        <!-- Big round profile picture overlapping the banner, then the User ID -->
        <div class="profile-header">
            <div class="pf-avatar-ring">
                <!-- id="disp-profile-pic" is updated by your JS; the URL is just a placeholder -->
                <img id="disp-profile-pic"
                     class="pf-avatar"
                     src="https://i.pravatar.cc/200?img=32"
                     alt="Profile picture">
            </div>

            <!-- User ID pill (id="disp-id" is filled by JS) -->
            <div class="pf-pill">
                <i class="fa-solid fa-fingerprint" aria-hidden="true"></i>
                <span class="pf-pill-label">User ID</span>
                <span id="disp-id" class="pf-pill-value">-</span>
            </div>
        </div>

        <!-- Details: 2 columns on desktop, 1 on phones. Each tile = icon badge + label + value -->
        <div class="profile-grid">

            <div class="profile-item">
                <span class="pf-icon"><i class="fa-solid fa-user" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>First Name</label>
                    <span id="disp-first-name">-</span>
                </div>
            </div>

            <div class="profile-item">
                <span class="pf-icon"><i class="fa-solid fa-user-tag" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>Last Name</label>
                    <span id="disp-last-name">-</span>
                </div>
            </div>

            <div class="profile-item">
                <span class="pf-icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>Email</label>
                    <span id="disp-email">-</span>
                </div>
            </div>

            <div class="profile-item">
                <span class="pf-icon"><i class="fa-solid fa-phone" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>Phone Number</label>
                    <span id="disp-phone">-</span>
                </div>
            </div>

            <div class="profile-item">
                <span class="pf-icon"><i class="fa-solid fa-venus-mars" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>Gender</label>
                    <span id="disp-gender">-</span>
                </div>
            </div>

            <div class="profile-item">
                <span class="pf-icon"><i class="fa-solid fa-cake-candles" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>Date of Birth</label>
                    <span id="disp-dob">-</span>
                </div>
            </div>

            <!-- Full-width tiles span both columns -->
            <div class="profile-item full-width">
                <span class="pf-icon"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>Address</label>
                    <span id="disp-address">-</span>
                </div>
            </div>

            <div class="profile-item full-width">
                <span class="pf-icon"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></span>
                <div class="pf-text">
                    <label>About</label>
                    <span id="disp-about">-</span>
                </div>
            </div>

        </div>

        <!-- Action area -->
        <div class="profile-actions">
            <a href="update_profile.html" class="btn-update-link">
                <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
                Update Profile
            </a>
        </div>

    </section>
</div>

<!-- Chooses "Student Profile" or "Teacher Profile" depending on the hosting dashboard -->
<script>
    (function () {
        var title = document.getElementById('disp-page-title');
        if (!title) return;

        // teacher.html has id="teacherUserName"; student.html has id="studentUserName"
        if (document.getElementById('teacherUserName')) {
            title.textContent = 'Teacher Profile';
        } else {
            title.textContent = 'Student Profile';
        }
    })();
</script>
