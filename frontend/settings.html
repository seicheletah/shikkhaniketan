<link rel="stylesheet" href="settings.css">

<div id="settings-wrapper">
    <div class="profile-card">
        <div class="profile-header">
    <img id="disp-profile-pic" src="https://i.pravatar.cc/100?img=32"
         alt="Profile Picture"
         style="width:90px; height:90px; border-radius:50%; object-fit:cover;">
    <h2>Student Profile</h2>
    <span class="badge">Active Student</span>
</div>

        <div class="profile-grid">
            <div class="profile-item">
                <label>First Name:</label>
                <span id="disp-first-name">-</span>
            </div>
            <div class="profile-item">
                <label>Last Name:</label>
                <span id="disp-last-name">-</span>
            </div>
            <div class="profile-item">
                <label>Email:</label>
                <span id="disp-email">-</span>
            </div>
            <div class="profile-item">
                <label>Phone Number:</label>
                <span id="disp-phone">-</span>
            </div>
            <div class="profile-item">
                <label>Gender:</label>
                <span id="disp-gender">-</span>
            </div>
            <div class="profile-item">
                <label>Date of Birth:</label>
                <span id="disp-dob">-</span>
            </div>
            <div class="profile-item full-width">
                <label>Address:</label>
                <span id="disp-address">-</span>
            </div>
            <div class="profile-item full-width">
                <label>About:</label>
                <span id="disp-about">-</span>
            </div>
        </div>

        <div class="profile-actions">
            <a href="update_profile.html" class="btn-update-link">
                <i class="fa-solid fa-pen-to-square"></i> Update Profile
            </a>
        </div>
    </div>
</div>
